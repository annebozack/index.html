<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Atlas</title>
<style>
  :root{
    --ink: #0F1720;
    --panel: #17212C;
    --panel-line: #33404C;
    --brass: #C4924A;
    --brass-dim: #8C6A38;
    --sage: #6B8776;
    --land: #26333E;
    --text-main: #ECE6D8;
    --text-dim: #93A2AB;
    --danger: #B8654F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .app {
    display: flex;
    flex-wrap: wrap;
    min-height: 100vh;
  }
  .ledger {
    width: 380px;
    min-width: 380px;
    min-height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--panel-line);
    display: flex;
    flex-direction: column;
    padding: 28px 26px 20px;
    overflow-y: auto;
  }
  .brand {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 26px;
    letter-spacing: 0.01em;
    color: var(--text-main);
    margin: 0 0 18px;
  }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brass);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"] {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--panel-line);
    color: var(--text-main);
    padding: 10px 12px;
    font-size: 14.5px;
    border-radius: 3px;
    font-family: inherit;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--brass);
  }
  .add-btn {
    margin-top: 20px;
    width: 100%;
    background: var(--brass);
    color: #1B140A;
    border: none;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .add-btn:hover:not(:disabled) { background: #D6A25C; }
  .add-btn:disabled { opacity: 0.5; cursor: default; }
  .status {
    margin-top: 10px;
    font-size: 12.5px;
    min-height: 16px;
    color: var(--text-dim);
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--sage); }
  .confirm-box {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: var(--ink);
    border: 1px solid var(--brass-dim);
    border-radius: 4px;
  }
  .confirm-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .confirm-place {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 12px;
  }
  .clear-confirm {
    display: none;
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--ink);
    border: 1px solid var(--danger);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--panel-line);
    margin: 22px 0 14px;
  }
  .entries-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .entries-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .clear-link {
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .clear-link:hover { color: var(--danger); }
  .entries {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .entry {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--panel-line);
    cursor: pointer;
  }
  .entry:hover { background: rgba(196,146,74,0.06); }
  .entry-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brass);
    flex-shrink: 0;
    margin-top: 5px;
  }
  .entry-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
  }
  .entry-place {
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .empty-note {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    padding: 10px 4px;
    line-height: 1.6;
  }
  .map-wrap {
    flex: 1 1 600px;
    min-height: 560px;
    position: relative;
    background: var(--ink);
    overflow: hidden;
  }
  #map-svg {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  #map-svg.dragging { cursor: grabbing; }
  .zoom-controls {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zoom-controls button {
    width: 32px;
    height: 32px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text-main);
    font-size: 16px;
    line-height: 1;
    border-radius: 4px;
    cursor: pointer;
  }
  .zoom-controls button:hover { border-color: var(--brass); color: var(--brass); }
  .land {
    fill: var(--land);
    stroke: #3A4753;
    stroke-width: 0.3;
    vector-effect: non-scaling-stroke;
  }
  .ocean {
    fill: var(--ink);
  }
  .pin {
    fill: var(--brass);
    stroke: #1B140A;
    stroke-width: 0.4;
    cursor: pointer;
    vector-effect: non-scaling-stroke;
  }
  .pin-pulse {
    fill: none;
    stroke: var(--brass);
    stroke-width: 0.6;
    opacity: 0;
    vector-effect: non-scaling-stroke;
  }
  .pin-pulse.active {
    animation: pulse 1s ease-out;
  }
  @keyframes pulse {
    0% { r: 1.5; opacity: 0.9; }
    100% { r: 8; opacity: 0; }
  }
  .pin-label-name, .pin-label-place {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    paint-order: stroke;
    stroke: var(--ink);
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }
  .pin-label-name {
    font-weight: 700;
    fill: var(--text-main);
  }
  .pin-label-place {
    font-weight: 400;
    fill: var(--text-dim);
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 12.5px;
    transform: translate(-50%, -120%);
    white-space: nowrap;
    display: none;
    z-index: 10;
  }
  .tooltip .t-name { font-weight: 700; margin-bottom: 1px; }
  .tooltip .t-place { color: var(--text-dim); }

  @media (max-width: 780px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .ledger {
      width: 100%; min-width: 0;
      min-height: 0;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--panel-line);
      padding: 18px 16px 14px;
    }
    .brand { font-size: 21px; margin-bottom: 14px; }
    label { margin-top: 12px; font-size: 10.5px; }
    input[type="text"] {
      font-size: 16px;
      padding: 11px 12px;
    }
    .add-btn { padding: 13px; font-size: 15px; }
    .entries { max-height: 30vh; overflow-y: auto; }
    .map-wrap { flex-basis: auto; min-height: 52vh; }
    .zoom-controls { top: auto; bottom: 16px; right: 12px; }
    .zoom-controls button { width: 38px; height: 38px; font-size: 18px; }
    .tooltip { font-size: 13px; }
  }

  @media (max-width: 420px) {
    .entries-title, .clear-link { font-size: 11px; }
    .entry-name { font-size: 13.5px; }
    .entry-place { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="ledger">
      <p class="brand">Campus Atlas</p>

      <form id="pin-form">
        <label for="name-input">Name</label>
        <input type="text" id="name-input" placeholder="e.g. Priya Shah" autocomplete="off" />

        <label for="place-input">University or city</label>
        <input type="text" id="place-input" placeholder="e.g. University of Michigan" autocomplete="off" />

        <button type="submit" class="add-btn" id="add-btn">Add pin</button>
        <div class="status" id="status"></div>
      </form>

      <div class="confirm-box" id="confirm-box">
        <div class="confirm-label">Pin this as</div>
        <div class="confirm-place" id="confirm-place"></div>
        <button type="button" class="add-btn" id="confirm-yes">Confirm pin</button>
        <button type="button" class="clear-link" id="confirm-no" style="display:block; margin-top:8px;">Not this one — let me edit</button>
      </div>

      <hr class="divider" />
      <div class="entries-head">
        <span class="entries-title">Pinned so far</span>
        <span>
          <button class="clear-link" id="refresh-btn" style="margin-right:12px;">refresh</button>
          <button class="clear-link" id="clear-btn">clear all</button>
        </span>
      </div>
      <div class="clear-confirm" id="clear-confirm">
        Remove all pins? This can't be undone.
        <div style="margin-top:8px;">
          <button type="button" class="clear-link" id="clear-yes" style="color: var(--danger); margin-right: 14px;">Yes, clear all</button>
          <button type="button" class="clear-link" id="clear-cancel">Cancel</button>
        </div>
      </div>
      <div class="entries" id="entries-list">
        <div class="empty-note">No pins yet — add the first one above.</div>
      </div>
    </div>
    <div class="map-wrap">

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    getFirestore, collection, addDoc, deleteDoc, doc, getDocs, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",

    appId: "YOUR_APP_ID"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const dbFs = getFirestore(firebaseApp);
  const pinsCol = collection(dbFs, "pins");

  // ---------------------------------------------------------------
  // App logic
  // ---------------------------------------------------------------
  let pins = [];
  let pendingRecord = null;

  const form = document.getElementById("pin-form");
  const nameInput = document.getElementById("name-input");
  const placeInput = document.getElementById("place-input");
  const addBtn = document.getElementById("add-btn");
  const statusEl = document.getElementById("status");
  const entriesList = document.getElementById("entries-list");
  const clearBtn = document.getElementById("clear-btn");
  const clearConfirm = document.getElementById("clear-confirm");
  const clearYes = document.getElementById("clear-yes");
  const clearCancel = document.getElementById("clear-cancel");
  const refreshBtn = document.getElementById("refresh-btn");
  const confirmBox = document.getElementById("confirm-box");
  const confirmPlace = document.getElementById("confirm-place");
  const confirmYes = document.getElementById("confirm-yes");
  const confirmNo = document.getElementById("confirm-no");
  const pinsGroup = document.getElementById("pins-group");
  const svgEl = document.getElementById("map-svg");
  const mapWrap = document.querySelector(".map-wrap");
  const tooltip = document.getElementById("tooltip");
  const ttName = document.getElementById("tt-name");
  const ttPlace = document.getElementById("tt-place");
  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");
  const zoomResetBtn = document.getElementById("zoom-reset");
  const svgNS = "http://www.w3.org/2000/svg";

  const WORLD_VB = { x: -180, y: -90, w: 360, h: 180 };
  const MIN_W = 8;
  const MAX_W = 360;
  let vb = { x: -180, y: -90, w: 360, h: 180 };

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function renderEntries() {
    if (pins.length === 0) {
      entriesList.innerHTML = '<div class="empty-note">No pins yet — add the first one above.</div>';
      return;
    }
    entriesList.innerHTML = "";
    pins.slice().reverse().forEach((p) => {
      const row = document.createElement("div");
      row.className = "entry";
      row.innerHTML =
        '<div class="entry-dot"></div>' +
        "<div>" +
          '<div class="entry-name">' + escapeHtml(p.name) + "</div>" +
          '<div class="entry-place">' + escapeHtml(p.place) + "</div>" +
        "</div>";
      row.addEventListener("click", () => flashPin(p));
      entriesList.appendChild(row);
    });
  }

  function showTooltip(p, evt) {
    const rect = mapWrap.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
    ttName.textContent = p.name;
    ttPlace.textContent = p.place;
    tooltip.style.display = "block";
  }
  function hideTooltip() { tooltip.style.display = "none"; }

  function applyViewBox() {
    svgEl.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
    updatePinRadii();
  }

  function clampPan() {
    const overscrollX = 50, overscrollY = 35;
    const minX = -180 - overscrollX, maxX = 180 - vb.w + overscrollX;
    const minY = -90 - overscrollY, maxY = 90 - vb.h + overscrollY;
    vb.x = Math.min(Math.max(vb.x, Math.min(minX, maxX)), Math.max(minX, maxX));
    vb.y = Math.min(Math.max(vb.y, Math.min(minY, maxY)), Math.max(minY, maxY));
  }

  function clientToSvgPoint(clientX, clientY) {
    const rect = svgEl.getBoundingClientRect();
    const nx = (clientX - rect.left) / rect.width;
    const ny = (clientY - rect.top) / rect.height;
    return { x: vb.x + nx * vb.w, y: vb.y + ny * vb.h };
  }

  function zoomAt(clientX, clientY, factor) {
    const p = clientToSvgPoint(clientX, clientY);
    let newW = vb.w * factor;
    newW = Math.min(MAX_W, Math.max(MIN_W, newW));
    const appliedFactor = newW / vb.w;
    const newH = vb.h * appliedFactor;
    vb.x = p.x - (p.x - vb.x) * appliedFactor;
    vb.y = p.y - (p.y - vb.y) * appliedFactor;
    vb.w = newW;
    vb.h = newH;
    clampPan();
    applyViewBox();
  }

  function pinRadius() { return 1.7 * (vb.w / WORLD_VB.w); }
  function pulseRadius() { return 1.5 * (vb.w / WORLD_VB.w); }
  function labelNameSize() { return 4.3 * (vb.w / WORLD_VB.w); }
  function labelPlaceSize() { return 3.6 * (vb.w / WORLD_VB.w); }
  function labelStroke() { return 1.1 * (vb.w / WORLD_VB.w); }

  function updatePinRadii() {
    const r = pinRadius(), pr = pulseRadius();
    pinsGroup.querySelectorAll(".pin").forEach((c) => c.setAttribute("r", r.toFixed(3)));
    pinsGroup.querySelectorAll(".pin-pulse").forEach((c) => c.setAttribute("r", pr.toFixed(3)));
    const nameSize = labelNameSize(), placeSize = labelPlaceSize(), stroke = labelStroke();
    const gap = r * 1.6;
    pinsGroup.querySelectorAll(".pin-label-name").forEach((t) => {
      t.setAttribute("font-size", nameSize.toFixed(3));
      t.setAttribute("stroke-width", stroke.toFixed(3));
      t.setAttribute("x", (parseFloat(t.dataset.cx) + gap).toFixed(3));
    });
    pinsGroup.querySelectorAll(".pin-label-place").forEach((t) => {
      t.setAttribute("font-size", placeSize.toFixed(3));
      t.setAttribute("stroke-width", stroke.toFixed(3));
      t.setAttribute("x", (parseFloat(t.dataset.cx) + gap).toFixed(3));
      t.setAttribute("y", (parseFloat(t.dataset.cy) + nameSize * 1.05).toFixed(3));
    });
  }

  svgEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  let dragging = false, dragLastX = 0, dragLastY = 0, dragMoved = false;
  svgEl.addEventListener("pointerdown", (e) => {
    dragging = true;
    dragMoved = false;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    svgEl.setPointerCapture(e.pointerId);
    svgEl.classList.add("dragging");
  });
  svgEl.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragLastX;
    const dy = e.clientY - dragLastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    const rect = svgEl.getBoundingClientRect();
    vb.x -= dx * (vb.w / rect.width);
    vb.y -= dy * (vb.h / rect.height);
    clampPan();
    applyViewBox();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    svgEl.classList.remove("dragging");
  }
  svgEl.addEventListener("pointerup", endDrag);
  svgEl.addEventListener("pointercancel", endDrag);
  svgEl.addEventListener("pointerleave", endDrag);

  zoomInBtn.addEventListener("click", () => {
    const rect = svgEl.getBoundingClientRect();
    zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.5);
  });
  zoomOutBtn.addEventListener("click", () => {
    const rect = svgEl.getBoundingClientRect();
    zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.5);
  });
  zoomResetBtn.addEventListener("click", () => {
    vb = { x: WORLD_VB.x, y: WORLD_VB.y, w: WORLD_VB.w, h: WORLD_VB.h };
    applyViewBox();
  });

  function flashPin(p) {
    const targetW = Math.min(vb.w, 40);
    vb.w = targetW;
    vb.h = targetW * (WORLD_VB.h / WORLD_VB.w);
    vb.x = p.lon - vb.w / 2;
    vb.y = (-p.lat) - vb.h / 2;
    clampPan();
    applyViewBox();
    const el = pinsGroup.querySelector('[data-key="' + p.lat + "," + p.lon + '"] .pin-pulse');
    if (el) {
      el.classList.remove("active");
      void el.getBBox();
      el.classList.add("active");
    }
  }

  function renderMarkers() {
    pinsGroup.innerHTML = "";
    const r = pinRadius(), pr = pulseRadius();
    const nameSize = labelNameSize(), placeSize = labelPlaceSize(), stroke = labelStroke();
    const gap = r * 1.6;
    pins.forEach((p) => {
      const x = p.lon;
      const y = -p.lat;
      const g = document.createElementNS(svgNS, "g");
      g.setAttribute("data-key", p.lat + "," + p.lon);

      const pulse = document.createElementNS(svgNS, "circle");
      pulse.setAttribute("class", "pin-pulse");
      pulse.setAttribute("cx", x);
      pulse.setAttribute("cy", y);
      pulse.setAttribute("r", pr);
      g.appendChild(pulse);

      const dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("class", "pin");
      dot.setAttribute("cx", x);
      dot.setAttribute("cy", y);
      dot.setAttribute("r", r);
      dot.addEventListener("mouseenter", (e) => showTooltip(p, e));
      dot.addEventListener("mousemove", (e) => showTooltip(p, e));
      dot.addEventListener("mouseleave", hideTooltip);
      dot.addEventListener("click", () => { if (!dragMoved) flashPin(p); });
      g.appendChild(dot);

      const nameText = document.createElementNS(svgNS, "text");
      nameText.setAttribute("class", "pin-label-name");
      nameText.setAttribute("x", x + gap);
      nameText.setAttribute("y", y);
      nameText.setAttribute("font-size", nameSize);
      nameText.setAttribute("stroke-width", stroke);
      nameText.setAttribute("dominant-baseline", "middle");
      nameText.dataset.cx = x;
      nameText.dataset.cy = y;
      nameText.textContent = p.name;
      g.appendChild(nameText);

      const placeText = document.createElementNS(svgNS, "text");
      placeText.setAttribute("class", "pin-label-place");
      placeText.setAttribute("x", x + gap);
      placeText.setAttribute("y", y + nameSize * 1.05);
      placeText.setAttribute("font-size", placeSize);
      placeText.setAttribute("stroke-width", stroke);
      placeText.setAttribute("dominant-baseline", "middle");
      placeText.dataset.cx = x;
      placeText.dataset.cy = y;
      placeText.textContent = p.place;
      g.appendChild(placeText);

      pinsGroup.appendChild(g);
    });
  }

  function pinFromDoc(docSnap) {
    const data = docSnap.data() || {};
    return { id: docSnap.id, name: data.name, place: data.place, lat: data.lat, lon: data.lon };
  }

  onSnapshot(pinsCol,
    (snap) => {
      pins = snap.docs.map(pinFromDoc).filter(p => typeof p.lat === "number" && typeof p.lon === "number");
      renderEntries();
      renderMarkers();
    },
    () => {
      setStatus("Live sync hit an error — pins may be out of date.", "error");
    }
  );

  async function geocode(place) {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(place);
    const res = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!res.ok) {
      const err = new Error("lookup failed");
      err.code = res.status === 429 ? "rate_limited" : "network_error";
      throw err;
    }
    const data = await res.json();
    if (!data || data.length === 0) {
      const err = new Error("not found"); err.code = "not_found"; throw err;
    }
    const parts = String(data[0].display_name || place).split(",").map(s => s.trim());
    const resolved = parts.slice(0, 2).join(", ");
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), resolved: resolved };
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const place = placeInput.value.trim();
    if (!name || !place) {
      setStatus("Enter both a name and a place.", "error");
      return;
    }
    addBtn.disabled = true;
    setStatus("Locating " + place + "…");
    try {
      const geo = await geocode(place);
      pendingRecord = { name: name, place: place, lat: geo.lat, lon: geo.lon, ts: Date.now() };
      confirmPlace.textContent = name + " — " + (geo.resolved || place);
      confirmBox.style.display = "block";
      setStatus("");
    } catch (err) {
      const code = err && err.code;
      if (code === "not_found") {
        setStatus("Couldn’t place \"" + place + "\" — try adding a country or state.", "error");
      } else if (code === "rate_limited") {
        setStatus("Too many lookups right now — wait a moment and try again.", "error");
      } else {
        setStatus("Something went wrong looking that up. Try again.", "error");
      }
    } finally {
      addBtn.disabled = false;
    }
  });

  confirmYes.addEventListener("click", async () => {
    if (!pendingRecord) return;
    confirmYes.disabled = true;
    try {
      await addDoc(pinsCol, pendingRecord);
      setStatus("Pinned " + pendingRecord.name + " at " + pendingRecord.place + ".", "ok");
      nameInput.value = "";
      placeInput.value = "";
      nameInput.focus();
    } catch (e) {
      setStatus("Could not save that pin. Try again.", "error");
    } finally {
      confirmYes.disabled = false;
      confirmBox.style.display = "none";
      pendingRecord = null;
    }
  });

  confirmNo.addEventListener("click", () => {
    confirmBox.style.display = "none";
    pendingRecord = null;
    placeInput.focus();
    placeInput.select();
  });

  clearBtn.addEventListener("click", () => {
    if (pins.length === 0) return;
    clearConfirm.style.display = "block";
  });
  clearCancel.addEventListener("click", () => {
    clearConfirm.style.display = "none";
  });
  clearYes.addEventListener("click", async () => {
    clearYes.disabled = true;
    setStatus("Clearing…");
    try {
      const snap = await getDocs(pinsCol);
      for (const d of snap.docs) {
        await deleteDoc(doc(dbFs, "pins", d.id));
      }
      setStatus("Cleared all pins.", "ok");
    } catch (e) {
      setStatus("Could not clear all pins. Try again.", "error");
    }
    clearYes.disabled = false;
    clearConfirm.style.display = "none";
  });

  refreshBtn.addEventListener("click", async () => {
    try {
      const snap = await getDocs(pinsCol);
      pins = snap.docs.map(pinFromDoc).filter(p => typeof p.lat === "number" && typeof p.lon === "number");
      renderEntries();
      renderMarkers();
    } catch (e) {
      setStatus("Refresh failed. Try again.", "error");
    }
  });
</script>
</body>
</html>
